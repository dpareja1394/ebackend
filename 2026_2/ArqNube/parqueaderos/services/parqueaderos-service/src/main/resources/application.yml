server:
  port: 8081
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: parqueaderos-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/parqueaderos}
    username: ${SPRING_DATASOURCE_USERNAME:parqueaderos}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vehiculos:
  url: ${VEHICULOS_URL:http://localhost:8082}
  timeout: 2s
